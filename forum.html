<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Darwin Life Hub · 北领地社区讨论</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta property="og:type" content="website">
  <meta property="og:title" content="Darwin Life Hub · 北领地社区讨论">
  <meta property="og:description" content="北领地社区讨论：生活问答、出行经验、邻里互助和本地信息交流。">
  <meta property="og:image" content="https://darwinbbs.com/darwin-logo.png">
  <meta property="og:url" content="https://darwinbbs.com/forum.html">
  <meta name="description" content="北领地社区讨论区，真实用户登录后发布话题与评论，分享生活经验、出行信息和互助需求。">

  <style>
    :root {
      --bg:#f5f9f5;
      --bg-card:#ffffff;
      --primary:#16a34a;
      --text-main:#0f172a;
      --text-muted:#6b7280;
      --border:#d1e5d4;
      --max-width:1040px;
    }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:var(--bg);
      color:var(--text-main);
    }
    a{color:inherit;text-decoration:none;}

    .top-nav{
      width:100%;
      background:#e8f5ec;
      padding:10px 0;
      border-bottom:1px solid #cfe8d8;
      position:sticky;
      top:0;
      z-index:30;
      box-shadow:0 2px 4px rgba(15,23,42,0.06);
    }
    .nav-inner{
      max-width:1100px;
      margin:0 auto;
      padding:0 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
    }
    .brand-logo{
      width:48px;
      height:48px;
      border-radius:50%;
      overflow:hidden;
      background:#ffffff;
      box-shadow:0 4px 14px rgba(0,0,0,0.15);
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .brand-logo img{ width:100%; height:100%; object-fit:cover; }
    .brand-text-main{ font-size:18px; font-weight:600; color:#022c22; }
    .brand-text-sub{ font-size:13px; color:var(--text-muted); margin-top:-2px; }

    nav.nav-links{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      font-size:15px;
    }
    nav.nav-links a{
      padding:6px 12px;
      border-radius:6px;
      color:#0f172a;
      text-decoration:none;
      transition:0.15s ease;
    }
    nav.nav-links a:hover{background:#d9fbe5;}
    nav.nav-links a.active{background:#16a34a;color:#f0fdf4;}

    .shell{max-width:var(--max-width);margin:0 auto;padding:24px 16px 60px;}
    .page-title{font-size:22px;font-weight:700;margin-bottom:8px;}
    .page-subtitle{font-size:13px;color:var(--text-muted);margin-bottom:18px;}

    .layout{
      display:grid;
      grid-template-columns:minmax(0,1.4fr);
      gap:18px;
    }
    .card{
      background:var(--bg-card);
      border-radius:18px;
      border:1px solid var(--border);
      padding:18px 18px 20px;
      box-shadow:0 18px 40px rgba(15,23,42,0.06);
    }
    .section-title{font-size:16px;font-weight:600;margin-bottom:12px;}

    label{display:block;font-size:13px;margin-bottom:4px;color:var(--text-muted);}
    input,textarea{
      width:100%;
      font-family:inherit;
      font-size:14px;
      padding:8px 10px;
      border-radius:10px;
      border:1px solid var(--border);
      margin-bottom:10px;
    }
    textarea{min-height:120px;resize:vertical;}

    button{
      border:none;
      border-radius:999px;
      padding:8px 20px;
      font-size:14px;
      cursor:pointer;
      background:var(--primary);
      color:#ffffff;
    }
    button:hover{background:#15803d;}

    .posts-empty{font-size:13px;color:var(--text-muted);}
    .post-card{
      margin-bottom:10px;
      padding:12px 14px;
      border-radius:12px;
      border:1px solid var(--border);
      background:#ffffff;
      box-shadow:0 6px 16px rgba(15,23,42,0.06);
      font-size:14px;
    }
    .post-card h3{margin-bottom:8px;}

    .fab{
      position:fixed; right:18px; bottom:18px;
      width:44px; height:44px;
      border-radius:50%;
      background:var(--primary);
      color:#ffffff;
      font-size:26px;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer;
      box-shadow:0 10px 24px rgba(15,23,42,0.6);
    }

    .preview-item{
      position:relative;
      display:inline-block;
    }
    .preview-remove{
      position:absolute;
      top:2px;
      right:2px;
      width:18px;
      height:18px;
      border:none;
      border-radius:50%;
      background:rgba(0,0,0,0.6);
      color:#fff;
      font-size:12px;
      line-height:18px;
      cursor:pointer;
    }
    .preview-remove:hover{background:rgba(0,0,0,0.8);}
    .clear-images-btn{
      margin-top:4px;
      padding:4px 10px;
      border-radius:999px;
      border:1px solid #d1e5d4;
      background:#f9fafb;
      font-size:12px;
      cursor:pointer;
      align-self:flex-start;
      color:red;
    }
    .clear-images-btn:hover{background:#e5f3ea;}

    .forum-photos{
      margin-top:8px;
      display:flex;
      flex-wrap:wrap;
      gap:6px;
    }
    .forum-photos img{
      width:90px;
      height:90px;
      object-fit:cover;
      border-radius:8px;
      border:1px solid var(--border);
    }

    .biu-form-top {
      margin-bottom: 10px;
    }

    .biu-editor-row {
      display:flex;
      gap:12px;
      align-items:flex-start;
    }

    .biu-editor-row textarea {
      margin-bottom:0;
      min-height:120px;
      flex:1;
    }

    .biu-side {
      width:120px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .biu-btn {
      width:100%;
      padding:12px 0;
      font-size:15px;
      font-weight:600;
    }

    button:disabled{opacity:.65;cursor:wait;}
    :focus-visible{outline:3px solid #166534;outline-offset:3px;}
    .forum-post-title{padding:0;border-radius:3px;background:none;color:#166534;text-align:left;font-size:17px;font-weight:700;overflow-wrap:anywhere;}
    .forum-post-title:hover{background:none;text-decoration:underline;}
    .forum-text{white-space:pre-wrap;line-height:1.75;overflow-wrap:anywhere;}
    .forum-meta{font-size:12px;color:#64748b;margin:8px 0;}
    .forum-help{font-size:13px;color:#475569;line-height:1.7;margin:8px 0;}
    .forum-help a,.forum-login-link,.forum-detail-photos a{color:#166534;text-decoration:underline;}
    .forum-login-link{display:inline-block;margin:10px;font-size:13px;}
    .forum-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:1000;}
    .forum-dialog{position:relative;max-width:800px;width:92%;max-height:90vh;overflow-y:auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 20px 45px rgba(15,23,42,.25);}
    .forum-dialog h2{padding-right:32px;font-size:21px;overflow-wrap:anywhere;}
    .forum-close{position:absolute;right:10px;top:6px;background:transparent;color:#334155;padding:4px 10px;font-size:26px;}
    .forum-close:hover{background:#e8f5ec;}
    .forum-comments{border-top:1px solid #d1e5d4;margin-top:20px;padding-top:16px;}
    .forum-comments label{margin-top:16px;}
    .forum-comment{padding:8px 0;border-bottom:1px dashed #d1e5d4;}
    .forum-detail-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:16px;}
    .forum-detail-photos img{display:block;width:100%;border-radius:8px;}
    .forum-detail-photos a{display:inline-block;font-size:12px;margin:6px 10px 0 0;}
    .preview-remove{padding:0;}
    [hidden]{display:none !important;}

    @media (max-width: 700px) {
      .biu-editor-row {
        flex-direction:column;
      }
      .biu-side {
        width:100%;
      }
      .biu-btn {
        width:100%;
      }
    }
  </style>
</head>
<body>

<header class="top-nav">
  <div class="nav-inner">
    <div class="brand">
      <div class="brand-logo">
        <img src="darwin-logo.png" alt="Darwin Life Hub" />
      </div>
      <div>
        <div class="brand-text-main">Darwin Life Hub</div>
        <div class="brand-text-sub">达尔文华人生活门户 · 社区</div>
      </div>
    </div>

    <nav class="nav-links">
      <a href="index.html">首页</a>
      <a href="news.html">新闻</a>
      <a href="jobs.html">工作</a>
      <a href="cv.html">Marketplace</a>
      <a href="rent.html">租房</a>
      <a href="forum.html" class="active" aria-current="page">社区</a>
      <a href="my.html">我的</a>
      <a href="about.html">关于</a>
    </nav>
  </div>
</header>

<div class="shell">
  <main>
<h1 class="page-title">北领地社区讨论</h1>
<p class="page-subtitle">生活问答、出行经验、邻里互助和本地见闻。阅读无需登录，登录后可发帖与评论。</p>

    <div class="layout">

      <section class="card" id="forumFormSection">
        <h2 class="section-title">发起讨论</h2>

        <form id="forumForm">
<label for="forumTitle">话题标题（必填，最多 80 字）</label>
<input id="forumTitle" name="title" type="text" maxlength="80" required placeholder="例如：刚搬到 Katherine，有哪些生活经验可以分享？" />
<label for="content">正文（必填，最多 5000 字）</label>
<div class="biu-editor-row" style="margin-top:10px;">
  <textarea id="content" name="content" maxlength="5000" required placeholder="写清地点、时间、你的问题或经验；引用信息时附上来源"></textarea>

  <div class="biu-side">
    <button type="submit" class="biu-btn">发布讨论</button>
    <div id="forumStatus" role="status" aria-live="polite" style="font-size:13px;color:#6b7280;"></div>
  </div>
</div>

<div class="biu-form-bottom" style="margin-top:10px;">
  <label for="forumImages">配图（可选，最多 5 张，每张 5MB 内）</label>
  <input id="forumImages" type="file" accept="image/jpeg,image/png,image/gif,image/webp,image/avif,image/bmp" multiple />
</div>

<div id="forumPreview" class="forum-photos"></div>
<button type="button" id="forumClearImages" class="clear-images-btn">清空图片</button>
<p class="forum-help">请先阅读 <a href="community-guidelines.html" target="_blank" rel="noopener noreferrer">社区交流与隐私提醒</a>。帖子正文与图片公开展示，请勿上传证件、住址或他人隐私。</p>
<p class="forum-help">帖子列表不展示作者资料，但这不代表匿名服务；评论可能显示昵称。当前表单每日最多提交 3 条（达尔文时间）。</p>
<a class="forum-login-link" href="login.html" target="_blank" rel="noopener noreferrer">登录 / 注册（新窗口）</a>
        </form>
      </section>

      <section class="card">
        <h2 class="section-title">社区话题</h2>
        <label for="forumSearch">搜索话题标题与正文</label>
        <input id="forumSearch" type="search" maxlength="200" placeholder="例如：Darwin、Alice Springs、交通、生活经验" aria-describedby="forumSearchHelp" />
        <p id="forumSearchHelp" class="forum-help">搜索已加载的公开讨论，不含评论；多个关键词用空格分隔。时间均为达尔文时间。</p>
        <p id="forumListStatus" role="status" aria-live="polite" class="forum-help">正在加载社区讨论…</p>
        <button id="forumRetry" type="button" hidden>重试</button>
        <div id="posts"></div>
        <noscript><p>需要启用 JavaScript 才能读取社区讨论。这里不会显示模拟帖子。</p></noscript>
      </section>

    </div>
  </main>
</div>

<button class="fab" id="fabForum" type="button" aria-label="跳转到发起讨论">+</button>

<script>
document.getElementById("fabForum").addEventListener("click", () => {
  document.getElementById("forumFormSection")
    .scrollIntoView({ behavior: "smooth" });
  document.getElementById("forumTitle").focus({ preventScroll: true });
});
</script>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="auth-guard.js"></script>
<script src="forum.js"></script>

</body>
</html>
